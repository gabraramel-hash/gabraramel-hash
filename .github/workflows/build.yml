name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          unzip -o HotShare.zip
          cd HotShare
          sed -i 's/-source 8 -target 8 -bootclasspath/--release 8 -classpath/' build.sh
          bash build.sh
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest HotShare/HotShare.apk --title "HotShare APK" --notes "HotShare"
